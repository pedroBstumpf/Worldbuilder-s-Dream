<!-- Textura provisória de couro (docs/05): ruído procedural próprio, em mosaico sem emendas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true">
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.04  0 0 0 0 0.025  0 0 0 0 0.015  2.6 0 0 0 -1.05" />
  </filter>
  <filter id="pores" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.04  0 0 0 0 0.025  0 0 0 0 0.015  -3.2 0 0 0 1.55" />
  </filter>
  <filter id="sheen" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="2" seed="23" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.86  0 0 0 0 0.66  3 0 0 0 -1.6" />
  </filter>
  <rect width="256" height="256" filter="url(#mottle)" opacity="0.5" />
  <rect width="256" height="256" filter="url(#pores)" opacity="0.35" />
  <rect width="256" height="256" filter="url(#sheen)" opacity="0.08" />
</svg>
