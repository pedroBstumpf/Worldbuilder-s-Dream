<!-- Textura provisória de pergaminho (docs/05): fibras e manchas procedurais próprias, em mosaico sem emendas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true">
  <filter id="stains" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.29  0 0 0 0 0.16  2.4 0 0 0 -1" />
  </filter>
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.35" numOctaves="2" seed="9" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.29  0 0 0 0 0.16  4 0 0 0 -2.1" />
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="17" stitchTiles="stitch" />
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.29  0 0 0 0 0.16  -2.5 0 0 0 1.35" />
  </filter>
  <rect width="256" height="256" filter="url(#stains)" opacity="0.14" />
  <rect width="256" height="256" filter="url(#fibers)" opacity="0.09" />
  <rect width="256" height="256" filter="url(#grain)" opacity="0.08" />
</svg>
